<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <defs>
    <linearGradient id="fk-star-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE500" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Clean Bold Typography "Zenkit" in White/Blue -->
  <g transform="translate(10, 8)">
    <!-- Wordmark -->
    <text x="0" y="44" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="42" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="-0.5" 
          fill="#FFFFFF">Zen<tspan fill="#FFE500">kit</tspan></text>

    <!-- Flipkart 'Explore Plus' Tagline -->
    <g transform="translate(2, 60)">
      <text x="0" y="0" 
            font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
            font-size="12" 
            font-style="italic" 
            font-weight="600" 
            fill="#F1F5F9">Explore <tspan fill="#FFE500" font-weight="800">Plus</tspan></text>
      
      <!-- Plus Golden Star Icon -->
      <polygon points="84,-6 86.5,-1 92,0 88,4 89,9.5 84,6.5 79,9.5 80,4 76,0 81.5,-1" 
               fill="url(#fk-star-gold)" />
    </g>
  </g>
</svg>
